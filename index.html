<title>Five Ways to Hang It</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&family=Archivo:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --ground:#E8E9E3; --surface:#F5F5F0; --raised:#FFFFFF;
  --ink:#1B1F1C; --muted:#5E655F; --faint:#8A9089;
  --line:#CDCFC5; --line-soft:#DEDFD7;
  --accent:#17727E; --accent-ink:#0E4A52; --warm:#A8431C; --on-accent:#FFFFFF;
  --wall:#DFDFD6; --wall-2:#D4D5CA; --frame:#6E6047; --mat:#FBFAF6;
  --shadow:0 1px 2px rgba(27,31,28,.07), 0 8px 24px rgba(27,31,28,.08);
  --shadow-lift:0 2px 6px rgba(27,31,28,.10), 0 18px 44px rgba(27,31,28,.16);
  --f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;
  --f-body:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121513; --surface:#191D1A; --raised:#1F2320;
    --ink:#E9E7DE; --muted:#9BA398; --faint:#767D74;
    --line:#2E342F; --line-soft:#252A26;
    --accent:#49AAB4; --accent-ink:#8FD3D9; --warm:#D9764A; --on-accent:#0B1214;
    --wall:#1A1E1B; --wall-2:#141816; --frame:#4A4032; --mat:#2A2E2A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#121513; --surface:#191D1A; --raised:#1F2320;
  --ink:#E9E7DE; --muted:#9BA398; --faint:#767D74;
  --line:#2E342F; --line-soft:#252A26;
  --accent:#49AAB4; --accent-ink:#8FD3D9; --warm:#D9764A; --on-accent:#0B1214;
  --wall:#1A1E1B; --wall-2:#141816; --frame:#4A4032; --mat:#2A2E2A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:500; text-wrap:balance; margin:0}
a{color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit; cursor:pointer}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px}
.label{font-size:11px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.spacer{flex:1}
[hidden]{display:none !important}

header.mast{border-bottom:1px solid var(--line); background:var(--surface)}
.mast-in{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:26px 0 20px; flex-wrap:wrap}
.brand h1{font-size:clamp(28px,4.2vw,44px); line-height:1; letter-spacing:-.01em}
.brand h1 em{font-style:italic}
.brand p{margin:8px 0 0; color:var(--muted); font-size:14px; max-width:52ch}
.mast-side{display:flex; align-items:center; gap:10px}
.ghost{background:transparent; border:1px solid var(--line); border-radius:var(--r); padding:8px 14px; font-size:13px; font-weight:500}
.ghost:hover{border-color:var(--accent); color:var(--accent)}
.ghost.sm{padding:5px 10px; font-size:12px}
.solid{background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); border-radius:var(--r); padding:9px 16px; font-size:13px; font-weight:600}
.solid:hover{filter:brightness(1.08)}
.solid.sm{padding:6px 12px; font-size:12px}
.danger{border-color:color-mix(in srgb,var(--warm) 45%,transparent); color:var(--warm)}
.danger:hover{border-color:var(--warm); color:var(--warm)}

.note{background:var(--raised); border:1px solid var(--line-soft); border-left:2px solid var(--accent); padding:12px 16px; font-size:13px; color:var(--muted); border-radius:0 var(--r) var(--r) 0; margin:20px 0 0}
.note strong{color:var(--ink); font-weight:600}
.note.draft{border-left-color:var(--warm)}
.note.draft b{color:var(--warm)}

.formats{padding:28px 0 4px}
.formats-head h2{font-size:20px}
.formats-head p{margin:4px 0 0; color:var(--muted); font-size:14px}
.fmt-row{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:16px}
@media (max-width:900px){.fmt-row{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.fmt-row{grid-template-columns:1fr}}
.fmt{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 13px 13px; display:flex; flex-direction:column; gap:9px; transition:border-color .16s, background .16s, transform .16s}
.fmt:hover{border-color:var(--faint); transform:translateY(-1px)}
.fmt[aria-pressed="true"]{border-color:var(--accent); background:var(--raised); box-shadow:inset 0 0 0 1px var(--accent)}
.fmt .thumb{height:44px; border:1px solid var(--line-soft); background:var(--wall); border-radius:2px; overflow:hidden}
.fmt .nm{font-family:var(--f-display); font-size:16px; line-height:1.1}
.fmt .bf{font-size:12px; color:var(--muted); line-height:1.4}
.fmt .bf b{color:var(--ink); font-weight:600}

.bar{position:sticky; top:0; z-index:30; margin-top:26px; background:color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.bar-in{display:flex; align-items:center; gap:14px; padding:11px 0; flex-wrap:wrap}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:transparent; border-radius:100px; padding:5px 13px; font-size:13px; color:var(--muted); transition:.15s}
.chip:hover{color:var(--ink); border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground); font-weight:500}
.count{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
select.sel, input.sel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:6px 10px; font-size:13px; color:var(--ink); font-family:inherit}

main{padding:30px 0 90px; min-height:60vh}

.piece-title{font-family:var(--f-display); font-size:17px; line-height:1.2}
.piece-title i{font-style:italic}
.meta{font-size:12.5px; color:var(--muted)}
.price{font-size:13px; font-variant-numeric:tabular-nums; font-weight:500}
.tag{display:inline-block; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px; border-radius:2px; vertical-align:2px}
.tag.avail{color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 45%, transparent)}
.tag.sold{color:var(--warm); border:1px solid color-mix(in srgb,var(--warm) 45%, transparent)}
.tag.show{color:var(--muted); border:1px solid var(--line)}

.salon{background:linear-gradient(180deg,var(--wall),var(--wall-2)); border:1px solid var(--line); padding:44px 34px 0; border-radius:var(--r)}
.salon-wall{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:34px 40px; padding-bottom:26px}
.hung{background:none; border:0; padding:0; display:block; position:relative}
.hung .fr{border:9px solid var(--frame); background:var(--mat); padding:10px; box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s}
.hung:hover .fr{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.hung img{display:block; width:100%; height:auto}
.hung .cap{margin-top:9px; text-align:center; max-width:230px}
.hung .cap .piece-title{font-size:14px}
.hung .cap .meta{font-size:11px}
.rail{height:1px; background:var(--line); margin:0 -34px}
.plinth{padding:14px 0 18px; text-align:center; font-size:12px; color:var(--faint)}

.masonry{columns:4 250px; column-gap:22px}
.masonry .card{break-inside:avoid; margin:0 0 22px}
.card{background:none; border:0; padding:0; display:block; width:100%; text-align:left}
.card img{display:block; width:100%; height:auto; border-radius:2px; box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s}
.card:hover img{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.card .cap{padding:10px 2px 0; display:flex; flex-direction:column; gap:2px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:26px 22px}
.grid .card .sq{aspect-ratio:1/1; background:var(--wall); border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:2px}
.grid .card .sq img{width:100%; height:100%; object-fit:cover; box-shadow:none; border-radius:0}
.grid .card .cap{padding-top:10px}
.grid .row{display:flex; justify-content:space-between; align-items:baseline; gap:10px}

.show{display:grid; grid-template-columns:1fr 300px; gap:34px; align-items:start}
@media (max-width:860px){.show{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,var(--wall),var(--wall-2)); border:1px solid var(--line); border-radius:var(--r); padding:34px; display:flex; align-items:center; justify-content:center; min-height:420px}
.stage .fr{border:11px solid var(--frame); background:var(--mat); padding:14px; box-shadow:var(--shadow-lift); max-width:100%}
.stage img{display:block; max-width:100%; max-height:52vh; width:auto; height:auto}
.show-side h3{font-size:26px; line-height:1.15}
.show-side .meta{margin-top:8px}
.show-side .body{margin:14px 0 0; font-size:14px; color:var(--muted); line-height:1.6}
.show-actions{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap}
.strip{display:flex; gap:8px; overflow-x:auto; padding:16px 2px 4px; margin-top:14px}
.strip button{flex:0 0 auto; width:70px; height:70px; padding:0; border:1px solid var(--line); background:var(--wall); border-radius:2px; overflow:hidden; opacity:.6; transition:.15s}
.strip button img{width:100%; height:100%; object-fit:cover; display:block}
.strip button:hover{opacity:.9}
.strip button[aria-current="true"]{opacity:1; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.showbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px; padding:12px 16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.showbar .label{color:var(--accent)}

.listwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:720px; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); font-weight:600; padding:12px 16px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:11px 16px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
td .thumb60{width:52px; height:52px; object-fit:cover; display:block; border:1px solid var(--line-soft); border-radius:2px}
td .tt{font-family:var(--f-display); font-style:italic; font-size:15px}
.linkish{background:none; border:0; padding:0; color:var(--accent); font-size:13px; font-weight:500; text-decoration:underline; text-underline-offset:3px}

.veil{position:fixed; inset:0; z-index:100; background:rgba(12,15,13,.72); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:24px}
.veil.open{display:flex}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); max-width:1000px; width:100%; max-height:92vh; overflow:auto; box-shadow:var(--shadow-lift)}
.sheet-grid{display:grid; grid-template-columns:1.25fr 1fr}
@media (max-width:800px){.sheet-grid{grid-template-columns:1fr}}
.sheet-img{background:linear-gradient(180deg,var(--wall),var(--wall-2)); padding:30px; display:flex; align-items:center; justify-content:center}
.sheet-img .fr{border:10px solid var(--frame); background:var(--mat); padding:12px; box-shadow:var(--shadow)}
.sheet-img img{display:block; max-width:100%; max-height:56vh; width:auto}
.sheet-body{padding:28px 28px 30px; display:flex; flex-direction:column; gap:14px}
.sheet-body h3{font-size:27px; line-height:1.12}
.dl{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13.5px; margin:0}
.dl dt{color:var(--faint)}
.dl dd{margin:0; font-variant-numeric:tabular-nums}
.cta-stack{display:flex; flex-direction:column; gap:8px; margin-top:4px}
.cta-stack button{width:100%; text-align:center; padding:11px 14px}
.closeX{position:sticky; top:0; float:right; margin:10px 10px 0; background:var(--surface); border:1px solid var(--line); border-radius:100px; width:30px; height:30px; line-height:1; font-size:16px; z-index:2}

.form{display:flex; flex-direction:column; gap:12px; padding:28px}
.form h3{font-size:24px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
input,textarea,select{font:inherit; font-size:14px; color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; font-family:inherit}
textarea{min-height:90px; resize:vertical; line-height:1.5}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:560px){.form-row{grid-template-columns:1fr}}
.form-foot{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px}
.hint{font-size:12px; color:var(--faint); line-height:1.5}
.sheet.narrow{max-width:560px}

footer{border-top:1px solid var(--line); background:var(--surface); padding:34px 0 46px}
.foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:30px}
@media (max-width:720px){.foot-grid{grid-template-columns:1fr}}
footer h4{font-size:17px; margin:0 0 8px}
footer p, footer li{font-size:13px; color:var(--muted); line-height:1.6; margin:0}
footer ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:5px}
.empty{padding:70px 0; text-align:center; color:var(--muted)}

/* ================= designer (admin) ================= */
.adminbar{position:sticky; top:0; z-index:40; background:var(--ink); color:var(--ground); border-bottom:1px solid var(--ink)}
.adminbar .wrap{display:flex; align-items:center; gap:12px; padding-top:10px; padding-bottom:10px; flex-wrap:wrap}
.adminbar .label{color:color-mix(in srgb,var(--ground) 60%, transparent)}
.adminbar strong{font-family:var(--f-display); font-weight:500; font-size:17px}
.adminbar button{border-radius:var(--r); font-size:12.5px; font-weight:500; padding:6px 12px; border:1px solid color-mix(in srgb,var(--ground) 34%, transparent); background:transparent; color:var(--ground)}
.adminbar button:hover{background:color-mix(in srgb,var(--ground) 14%, transparent)}
.adminbar button.key{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.saved{font-size:12px; color:color-mix(in srgb,var(--ground) 62%, transparent); font-variant-numeric:tabular-nums}

.designer{display:grid; grid-template-columns:352px 1fr; gap:0; align-items:start; min-height:70vh}
@media (max-width:980px){.designer{grid-template-columns:1fr}}
.rail-l{border-right:1px solid var(--line); background:var(--surface); position:sticky; top:53px; max-height:calc(100vh - 53px); overflow:auto}
@media (max-width:980px){.rail-l{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line)}}
.tabs{display:flex; border-bottom:1px solid var(--line)}
.tabs button{flex:1; background:transparent; border:0; border-bottom:2px solid transparent; padding:11px 8px; font-size:13px; font-weight:500; color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.pane{padding:16px}
.pane h4{font-size:15px; margin-bottom:2px}
.pane .hint{margin:0 0 12px}

.drop{border:1.5px dashed var(--line); border-radius:var(--r); padding:18px 14px; text-align:center; background:var(--raised); transition:.15s; cursor:pointer}
.drop:hover, .drop.over{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 7%, var(--raised))}
.drop .big{font-family:var(--f-display); font-size:16px}
.drop .hint{margin:4px 0 0}

.worklist{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:4px}
.worklist li{display:flex; align-items:center; gap:9px; padding:6px; border:1px solid transparent; border-radius:var(--r); background:var(--raised); cursor:grab}
.worklist li:hover{border-color:var(--line)}
.worklist li[aria-selected="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.worklist li.dragging{opacity:.4}
.worklist li.over{border-top:2px solid var(--accent)}
.worklist img{width:40px; height:40px; object-fit:cover; border:1px solid var(--line-soft); border-radius:2px; flex:0 0 auto}
.worklist .wt{flex:1; min-width:0}
.worklist .wt b{display:block; font-family:var(--f-display); font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.worklist .wt span{font-size:11px; color:var(--faint)}
.worklist .hand{color:var(--faint); font-size:14px; letter-spacing:-2px}

.inspector{border-top:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:11px; background:var(--raised)}
.inspector .field label{font-size:10.5px}
.inspector input, .inspector select, .inspector textarea{font-size:13px; padding:6px 9px}
.inspector textarea{min-height:70px}
.trio{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.check input{width:15px; height:15px; padding:0}
.rail-r{padding:22px 24px 60px; min-width:0}
.preview-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.preview-head .label{color:var(--faint)}
.mini-fmt{display:flex; gap:5px; flex-wrap:wrap}
.mini-fmt button{border:1px solid var(--line); background:var(--surface); border-radius:100px; padding:4px 11px; font-size:12px; color:var(--muted)}
.mini-fmt button[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.exportbox{width:100%; min-height:150px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; line-height:1.45}
.gate{max-width:430px; margin:12vh auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:28px; display:flex; flex-direction:column; gap:13px}
.gate h2{font-size:24px}
.gate code{font-family:ui-monospace,Menlo,monospace; font-size:12px; background:var(--raised); border:1px solid var(--line-soft); padding:1px 4px; border-radius:2px}
.draftdot{font-style:normal; font-size:9.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--warm); border:1px solid color-mix(in srgb,var(--warm) 40%,transparent); border-radius:2px; padding:1px 4px; margin-left:5px}
.adminbar .saved{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<div id="app"></div>
<div class="veil" id="veil" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   western-gallery — one file, two modes.
   #admin  designer: upload art, arrange it, export to the repo
   (no hash) viewer: shows exactly what was arranged
============================================================ */

const CATS = [
  {key:'animals',   name:'Animals',    blurb:'Horses, cattle, and the wild things'},
  {key:'people',    name:'People',     blurb:'Riders, hands, and portraits'},
  {key:'buildings', name:'Buildings',  blurb:'Barns, line shacks, and main streets'},
  {key:'landscapes',name:'Landscapes', blurb:'Basin, range, and big weather'}
];
const MOTIFS = ['horse','bison','deer','figure','rider','barn','mill','pine','mesa','butte'];
const CAT_MOTIF = {animals:'horse', people:'rider', buildings:'barn', landscapes:'mesa'};

const FORMATS = [
  {key:'salon',   name:'Salon Hang',   for:'First impressions', best:'Feels like walking into the gallery. Varied sizes, real frames.'},
  {key:'masonry', name:'Masonry',      for:'Instagram traffic', best:'Every canvas at its true proportion, endless scroll.'},
  {key:'grid',    name:'Catalog Grid', for:'Buyers',            best:'Uniform tiles with price and status. Fast to compare.'},
  {key:'show',    name:'Show Preview', for:'Pre-show emails',   best:'One work at a time with the story beside it.'},
  {key:'list',    name:'Price List',   for:'Collectors',        best:'Dimensions, medium, year, price. No scrolling past art.'}
];

const SAMPLE = {
  meta:{
    title:'Five Ways to Hang It', tagline:'The same works, laid out five different ways — pick the one that fits how you sell.',
    email:'studio@example.com', defaultFormat:'salon', sample:true
  },

/* ---------------- image store (IndexedDB) ---------------- */
const DB={db:null};
function idb(){
  if(DB.db) return Promise.resolve(DB.db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('western-gallery',1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('images')) r.result.createObjectStore('images',{keyPath:'id'}); };
    r.onsuccess=()=>{ DB.db=r.result; res(DB.db); }; r.onerror=()=>rej(r.error);
  });
}
async function idbTx(mode,fn){ const db=await idb(); return new Promise((res,rej)=>{
  const tx=db.transaction('images',mode), st=tx.objectStore('images'); let out;
  out=fn(st); tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); tx.onerror=()=>rej(tx.error);
});}
const idbPut = rec => idbTx('readwrite', st=>st.put(rec));
const idbDel = id  => idbTx('readwrite', st=>st.delete(id));
const idbAll = ()  => idbTx('readonly',  st=>st.getAll());

function paint(work,W){

  c.width=W*dpr; c.height=H*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr);
  const ramp=(SKY[work.cat]||SKY.landscapes)[seed%2];
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,ramp[0]); g.addColorStop(.55,ramp[1]); g.addColorStop(1,ramp[2]);
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const sx=W*(.2+r()*.6), sy=H*(.2+r()*.22), sr=W*.045;
  const sg=x.createRadialGradient(sx,sy,0,sx,sy,sr*4.5);
  sg.addColorStop(0,'rgba(255,244,214,.95)'); sg.addColorStop(1,'rgba(255,244,214,0)');
  x.fillStyle=sg; x.beginPath(); x.arc(sx,sy,sr*4.5,0,7); x.fill();
  x.fillStyle='rgba(255,250,232,.9)'; x.beginPath(); x.arc(sx,sy,sr,0,7); x.fill();
  const bands=4, base=H*.52;
  for(let b=0;b<bands;b++){
    const y0=base+(H-base)*(b/bands)*.72, amp=H*(.10-b*.018)+4;
    x.beginPath(); x.moveTo(0,H); x.lineTo(0,y0);
    const ph1=r()*6, ph2=r()*6;
    for(let px=0;px<=W;px+=8){
      const t=px/W;
      x.lineTo(px, y0+Math.sin(t*(2+b)*Math.PI+ph1)*amp+Math.sin(t*(6+b*3)*Math.PI+ph2)*amp*.34);
    }
    x.lineTo(W,H); x.closePath();
    x.fillStyle=RIDGE[b+1]; x.globalAlpha=.92; x.fill(); x.globalAlpha=1;
  }
  x.fillStyle='#171c1e';
  const gy=base+(H-base)*.80, mid=W*(.28+r()*.42), S=Math.min(W,H)*0.26;
  (MOTIF[work.motif]||MOTIF[CAT_MOTIF[work.cat]]||MOTIF.pine)(x,mid,gy,S);
  x.globalAlpha=.05;
  for(let i=0;i<W*H/90;i++){ x.fillStyle=r()>.5?'#fff':'#000'; x.fillRect(r()*W,r()*H,1.4,1.4); }
  x.globalAlpha=1;
  const v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.28,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(20,16,10,.28)');
  x.fillStyle=v; x.fillRect(0,0,W,H);

}

const pcache={};
function imgSrc(w,width){
  if(w.imgId && objUrl[w.imgId]) return objUrl[w.imgId];
  if(w.thumb && width<=220) return w.thumb;
  if(w.img) return w.img;
  const k=w.id+'|'+w.cat+'|'+w.motif+'|'+w.w+'x'+w.h+'@'+width;
  if(!pcache[k]) pcache[k]=paint(w,width);
  return pcache[k];
}
function imgTag(w,width,attrs){
  return '<img alt="'+esc(w.t)+'" src="'+imgSrc(w,width)+'" '+(attrs||'')+
    ' onerror="this.onerror=null;this.src=\''+paintFallback(w,width)+'\'">';
}
function paintFallback(w,width){ const k='fb'+w.id+'@'+width; if(!pcache[k]) pcache[k]=paint(w,width); return pcache[k]; }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- helpers ---------------- */
const money = n => '$'+Number(n||0).toLocaleString('en-US');
const dims  = w => (w.w||0)+' × '+(w.h||0)+' in';
const catName = k => (CATS.find(c=>c.key===k)||{name:'—'}).name;
function statusTag(w){
  if(w.status==='sold') return '<span class="tag sold">Sold</span>';
  if(w.show) return '<span class="tag avail">Available</span> <span class="tag show">In show</span>';
  return '<span class="tag avail">Available</span>';
}
function capHTML(w,withPrice){

    '<div class="meta">'+esc(w.med)+' · '+dims(w)+(w.yr?' · '+w.yr:'')+'</div>'+
    (withPrice?'<div class="price">'+(w.status==='sold'?'—':money(w.price))+' '+statusTag(w)+'</div>':'');
}
function visible(){

    (state.cat==='all'||w.cat===state.cat) &&

/* ---------------- gallery renderers ---------------- */
function renderGallery(stage,list){
  stage.innerHTML='';
  if(!list.length){ stage.innerHTML='<p class="empty">Nothing matches that combination.</p>'; return; }
  ({salon:salonView,masonry:masonryView,grid:gridView,show:showView,list:listView})[state.fmt](stage,list);
}
function salonView(stage,list){
  const wall=document.createElement('div'); wall.className='salon';
  const inner=document.createElement('div'); inner.className='salon-wall';
  list.forEach(w=>{
    const scale=96+Math.min(w.w||24,60)*2.1;
    const b=document.createElement('button'); b.className='hung'; b.dataset.work=w.id;
    b.innerHTML='<div class="fr" style="width:'+Math.round(scale)+'px">'+imgTag(w,420,'style="width:100%;height:auto"')+'</div>'+
      '<div class="cap">'+capHTML(w,false)+'</div>';
    inner.appendChild(b);
  });
  wall.appendChild(inner);
  wall.insertAdjacentHTML('beforeend','<div class="rail"></div><div class="plinth">Hung salon-style · click any work for details</div>');
  stage.appendChild(wall);
}
function masonryView(stage,list){
  const m=document.createElement('div'); m.className='masonry';
  list.forEach(w=>{
    const b=document.createElement('button'); b.className='card'; b.dataset.work=w.id;
    b.innerHTML=imgTag(w,520)+'<div class="cap">'+capHTML(w,true)+'</div>';
    m.appendChild(b);
  });
  stage.appendChild(m);
}
function gridView(stage,list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(w=>{
    const b=document.createElement('button'); b.className='card'; b.dataset.work=w.id;
    b.innerHTML='<div class="sq">'+imgTag(w,520)+'</div>'+
      '<div class="cap"><div class="piece-title"><i>'+esc(w.t)+'</i></div>'+
      '<div class="row"><span class="meta">'+dims(w)+'</span>'+
      '<span class="price">'+(w.status==='sold'?'Sold':money(w.price))+'</span></div></div>';
    g.appendChild(b);
  });
  stage.appendChild(g);
}
function showView(stage,list){
  const hero=list.find(w=>w.id===state.hero)||list[0]; state.hero=hero.id;
  const story=hero.story||'Add a paragraph in the designer — where it was painted, what you were after. A sentence or two in your own voice turns a photograph into a work someone wants to live with.';
  const el=document.createElement('div');
  el.innerHTML=

/* ---------------- format thumbnails ---------------- */
function fmtThumb(key){
  const c=document.createElement('canvas'),W=200,H=88,d=2;
  c.width=W*d; c.height=H*d; c.style.width='100%'; c.style.height='100%';
  const x=c.getContext('2d'); x.scale(d,d);
  x.fillStyle=getComputedStyle(document.body).getPropertyValue('--faint').trim()||'#888';
  x.globalAlpha=.55; const R=(a,b,w,h)=>x.fillRect(a,b,w,h);
  if(key==='salon'){ R(16,26,34,26); R(58,18,42,34); R(108,28,26,22); R(142,20,44,32); x.globalAlpha=.3; R(10,60,180,1); }
  if(key==='masonry'){ const cols=[10,58,106,154],hs=[[30,44],[44,30],[26,50],[38,34]];
    cols.forEach((cx,i)=>{ R(cx,10,36,hs[i][0]); R(cx,10+hs[i][0]+6,36,hs[i][1]); }); }
  if(key==='grid'){ for(let r=0;r<2;r++) for(let i=0;i<4;i++) R(12+i*46,12+r*38,36,30); }
  if(key==='show'){ R(14,12,110,64); x.globalAlpha=.32; for(let i=0;i<4;i++) R(134,12+i*17,52,13); }
  if(key==='list'){ for(let i=0;i<5;i++){ R(14,12+i*14,18,10); x.globalAlpha=.3; R(38,15+i*14,110,4); R(156,15+i*14,30,4); x.globalAlpha=.55; } }
  return c;
}

/* ---------------- uploads ---------------- */
const slug = s => String(s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'untitled';
function readSize(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ res({w:im.naturalWidth,h:im.naturalHeight,url}); };
    im.onerror=()=>res({w:4,h:3,url});
    im.src=url;
  });
}
const titleFromFile = n => n.replace(/\.[a-z0-9]+$/i,'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function inchesFor(pw,ph){
  const long=24, ratio=(pw||4)/(ph||3);
  return ratio>=1 ? {w:long, h:Math.max(1,Math.round(long/ratio))} : {w:Math.max(1,Math.round(long*ratio)), h:long};
}
async function shrink(file,max,q){
  let bmp=null;
  try{ bmp=await createImageBitmap(file); }
  catch{
    bmp=await new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=URL.createObjectURL(file); });
  }
  if(!bmp) return {blob:file, w:0, h:0};
  const nw=bmp.width||bmp.naturalWidth, nh=bmp.height||bmp.naturalHeight;
  const scale=Math.min(1, max/Math.max(nw,nh));
  const cw=Math.max(1,Math.round(nw*scale)), ch=Math.max(1,Math.round(nh*scale));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  c.getContext('2d').drawImage(bmp,0,0,cw,ch);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  return {blob:blob||file, w:nw, h:nh};
}
async function addFiles(files){
  if(!files.length) return;
  if(C.meta.sample){ C.works=[]; C.meta.sample=false; }
  backend ? await addFilesBackend(files) : await addFilesLocal(files);
  state.sel=C.works[C.works.length-1].id;
  mountAdmin();
}
async function addFilesBackend(files){
  let i=0;
  for(const f of files){
    stamp('Uploading '+(++i)+' of '+files.length+'…');
    const web=await shrink(f,2000,.86), thumb=await shrink(f,600,.8);
    const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
    const wp='works/'+id+'/web.jpg', tp='works/'+id+'/thumb.jpg';
    const up1=await sb.storage.from('artwork').upload(wp,web.blob,{contentType:'image/jpeg',upsert:true});
    if(up1.error){ stamp('Upload failed — '+up1.error.message); return; }
    const up2=await sb.storage.from('artwork').upload(tp,thumb.blob,{contentType:'image/jpeg',upsert:true});
    if(up2.error){ stamp('Upload failed — '+up2.error.message); return; }
    const inches=inchesFor(web.w,web.h);
    const row={id, title:titleFromFile(f.name), category:'landscapes', medium:'Oil on linen',
      width_in:inches.w, height_in:inches.h, year:new Date().getFullYear(), price:0,
      status:'available', in_show:false, story:'', image_path:wp, thumb_path:tp,
      sort:C.works.length, published:false};
    const {data,error}=await sb.from('works').insert(row).select().single();
    if(error){ stamp('Could not save — '+error.message); return; }
    C.works.push(fromRow(data));
  }
  stamp('Uploaded — set the details, then tick “Visible on the site”');
}
async function addFilesLocal(files){
  for(const f of files){
    const {w:pw,h:ph,url}=await readSize(f);
    const id='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const inches=inchesFor(pw,ph);
    await idbPut({id, name:f.name, type:f.type, blob:f});
    blobs[id]={name:f.name,blob:f}; objUrl[id]=url;
    C.works.push({id, imgId:id, file:f.name, t:titleFromFile(f.name),
      cat:'landscapes', motif:'mesa', med:'Oil on linen',
      w:inches.w, h:inches.h, yr:new Date().getFullYear(),
      price:0, status:'available', show:false, story:''});
  }
  saveDraft();
}

/* ---------------- export (zip, stored) ---------------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){ // [{name, data:Uint8Array}]
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name), crc=crc32(f.data), len=f.data.length;
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(len),...u32(len),...u16(name.length),...u16(0)];
    parts.push(new Uint8Array(local), name, f.data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(len),...u32(len),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)], name);
    off+=local.length+name.length+len;
  });
  const cdStart=off; const cd=[];
  for(let i=0;i<central.length;i+=2){ cd.push(new Uint8Array(central[i]), central[i+1]); off+=central[i].length+central[i+1].length; }
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(off-cdStart),...u32(cdStart),...u16(0)]);
  return new Blob([...parts,...cd,eocd],{type:'application/zip'});
}
function exportJSON(){
  const used={};
  const works=C.works.map(w=>{
    const o={id:w.id,t:w.t,cat:w.cat,med:w.med,w:w.w,h:w.h,yr:w.yr,price:w.price,status:w.status,show:!!w.show,story:w.story||''};
    if(w.imgId&&blobs[w.imgId]){
      const ext=(blobs[w.imgId].name.match(/\.[a-z0-9]+$/i)||['.jpg'])[0].toLowerCase();
      let base=slug(w.t); while(used[base+ext]) base+='-2';
      used[base+ext]=w.imgId; o.img='photos/'+base+ext;
    } else { o.motif=w.motif; }
    return o;
  });
  return {json:{meta:{...C.meta,sample:false},show:C.show,works}, used};
}
async function openExport(){
  const {json,used}=exportJSON();
  const text=JSON.stringify(json,null,2);
  const n=Object.keys(used).length;
  openSheet('<div class="form"><div><div class="label">Publish</div><h3>Export for the repo</h3></div>'+
    '<p class="hint">Downloads <b>gallery-export.zip</b> — <code>collection.json</code> plus '+n+' photograph'+(n===1?'':'s')+' in <code>photos/</code>. Unzip it into the repo root, overwrite what is there, and commit. The site reads <code>collection.json</code> on load.</p>'+
    '<div class="form-foot"><button class="solid" id="dlZip">Download zip</button>'+
    '<button class="ghost" id="cpJson">Copy collection.json</button>'+
    '<span class="hint" id="expNote"></span></div>'+
    '<div class="field"><label for="expBox">collection.json</label><textarea class="exportbox" id="expBox" readonly>'+esc(text)+'</textarea></div>'+
    '</div>', true);
  document.getElementById('dlZip').onclick=async()=>{
    const note=document.getElementById('expNote'); note.textContent='Packing…';
    const files=[{name:'collection.json',data:new TextEncoder().encode(text)}];
    for(const [fname,imgId] of Object.entries(used)){
      const buf=await blobs[imgId].blob.arrayBuffer();
      files.push({name:'photos/'+fname,data:new Uint8Array(buf)});
    }
    const b=zip(files), a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='gallery-export.zip';
    document.body.appendChild(a); a.click(); a.remove();
    note.textContent='Downloaded. Unzip into the repo root and commit.';
  };
  document.getElementById('cpJson').onclick=async()=>{
    const note=document.getElementById('expNote');
    try{ await navigator.clipboard.writeText(text); note.textContent='Copied.'; }
    catch{ note.textContent='Copy blocked — select the text below instead.'; }
  };
}

/* ---------------- detail sheet + inquiries ---------------- */
const veil=document.getElementById('veil'), sheet=document.getElementById('sheet');
function openSheet(html,narrow){
  sheet.className='sheet'+(narrow?' narrow':'');
  sheet.innerHTML='<button class="closeX" data-close aria-label="Close">×</button>'+html;
  veil.classList.add('open'); document.body.style.overflow='hidden';
  const f=sheet.querySelector('input,textarea,button:not([data-close])'); if(f) f.focus();
}
function closeSheet(){ veil.classList.remove('open'); document.body.style.overflow=''; }
veil.addEventListener('click',e=>{ if(e.target===veil||e.target.closest('[data-close]')) closeSheet(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function openWork(w){
  openSheet('<div class="sheet-grid"><div class="sheet-img"><div class="fr">'+imgTag(w,900)+'</div></div>'+
    '<div class="sheet-body"><h3><i>'+esc(w.t)+'</i></h3>'+
    (w.story?'<p class="meta" style="line-height:1.6">'+esc(w.story)+'</p>':'')+
    '<dl class="dl"><dt>Medium</dt><dd>'+esc(w.med)+'</dd><dt>Size</dt><dd>'+dims(w)+'</dd>'+
    '<dt>Year</dt><dd>'+(w.yr||'—')+'</dd><dt>Subject</dt><dd>'+catName(w.cat)+'</dd>'+
    '<dt>Price</dt><dd>'+(w.status==='sold'?'Sold':money(w.price))+'</dd></dl>'+
    '<div>'+statusTag(w)+'</div>'+
    '<div class="cta-stack">'+
      (w.status==='sold'
        ?'<button class="solid" data-inquiry="commission" data-id="'+w.id+'">Commission something similar</button>'
        :'<button class="solid" data-inquiry="purchase" data-id="'+w.id+'">Inquire to purchase</button>')+
      '<button class="ghost" data-inquiry="hold" data-id="'+w.id+'">See it at the next show</button>'+
      '<button class="ghost" data-inquiry="commission" data-id="'+w.id+'">Commission a piece</button>'+
    '</div><p class="hint">Inquiries go straight to the studio inbox.</p></div></div>');
}
function openInquiry(kind,id){
  const w=C.works.find(x=>x.id===id);
  const INTENT={
    purchase:{h:'Inquire to purchase',sub:'Tell me where it would hang and I will follow up with availability, framing and shipping.'},
    hold:{h:'See it before the show',sub:'I will send images and hold the piece for you through the opening at '+C.show.name+'.'},
    commission:{h:'Commission a piece',sub:'Subject, size, timing, budget range — as much or as little as you know so far.'}
  };
  const i=INTENT[kind]||INTENT.purchase;
  const ref=w?'\n\nWork: "'+w.t+'" ('+w.med+', '+dims(w)+(w.yr?', '+w.yr:'')+')':'';
  const seed = kind==='commission'
    ? 'I would like to commission a piece.\n\nSubject:\nApproximate size:\nNeeded by:\nBudget range:'+ref
    : kind==='hold' ? 'I would like to see this work at '+C.show.name+' ('+C.show.where+').'+ref
    : 'I am interested in purchasing this work.'+ref;
  openSheet('<form class="form" id="inq"><div><div class="label">'+esc(w?w.t:'Studio inquiry')+'</div><h3>'+i.h+'</h3></div>'+
    '<p class="hint" style="margin:-6px 0 2px">'+esc(i.sub)+'</p>'+
    '<div class="form-row"><div class="field"><label for="nm">Your name</label><input id="nm" required></div>'+
    '<div class="field"><label for="em">Email</label><input id="em" type="email" required></div></div>'+
    '<div class="field"><label for="msg">Message</label><textarea id="msg" style="min-height:110px">'+esc(seed)+'</textarea></div>'+
    '<div class="form-foot"><button class="solid" type="submit">Send inquiry</button>'+
    '<button class="ghost" type="button" data-copy>Copy message</button>'+
    '<span class="hint" id="inqNote">Opens in your email app.</span></div>'+
    '<p class="hint">This site has no server, so it hands the message to your email client. Point the form at a form service to collect them properly.</p></form>',true);
  const f=document.getElementById('inq');
  const compose=()=>({subj:i.h+(w?' — "'+w.t+'"':''),
    body:document.getElementById('msg').value+'\n\n— '+document.getElementById('nm').value+'\n'+document.getElementById('em').value});
  f.onsubmit=e=>{ e.preventDefault(); const m=compose();
    location.href='mailto:'+C.meta.email+'?subject='+encodeURIComponent(m.subj)+'&body='+encodeURIComponent(m.body);
    document.getElementById('inqNote').textContent='Handed off to your email app.'; };
  f.querySelector('[data-copy]').onclick=async()=>{
    const m=compose(), note=document.getElementById('inqNote');
    try{ await navigator.clipboard.writeText(m.subj+'\n\n'+m.body); note.textContent='Copied to your clipboard.'; }
    catch{ note.textContent='Copy blocked here — select the text instead.'; }
  };
}
document.addEventListener('click',e=>{
  const inq=e.target.closest('[data-inquiry]'); if(inq){ openInquiry(inq.dataset.inquiry,inq.dataset.id); return; }
  const wk=e.target.closest('[data-work]');
  if(wk && mode==='viewer'){ const w=C.works.find(x=>x.id===wk.dataset.work); if(w) openWork(w); return; }
  if(wk && mode==='admin'){ state.sel=wk.dataset.work; state.tab='works'; mountAdmin(); }
});

/* ---------------- boot ---------------- */
function toggleTheme(){
  const now=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme', now==='dark'?'light':'dark');
  rerender();
}
function rerender(){ mode==='admin'?mountAdmin():mountViewer(); }
addEventListener('hashchange',()=>{ mode=location.hash.replace('#','')==='admin'?'admin':'viewer'; state.sel=null; rerender(); });

function normalize(first){
  C.meta=Object.assign({defaultFormat:'salon',email:'studio@example.com',title:'Gallery',tagline:''},C.meta);
  C.show=Object.assign({name:'',where:'',when:''},C.show);
  if(first) state.fmt=C.meta.defaultFormat||'salon';
}
let booted=false;
async function boot(){
  if(backend){
    try{
      await refreshAuth();
      C=await loadBackend();
      sb.auth.onAuthStateChange(async ev=>{
        if(!booted || !['SIGNED_IN','SIGNED_OUT','USER_UPDATED'].includes(ev)) return;
        await refreshAuth();
        try{ C=await loadBackend(); normalize(false); }catch{}
        rerender();
      });
    }catch(e){
      backend=false; C=null;
      authMsg='Could not reach the database — showing the local copy.';
      console.warn('Supabase unavailable:',e);
    }
  }
  if(!C){
    try{
      const r=await fetch('collection.json',{cache:'no-store'});
      if(r.ok) published=await r.json();
    }catch{}
    const draft=loadDraft();
    if(draft&&draft.works){ C=draft; usingDraft=true; }
    else C=published||JSON.parse(JSON.stringify(SAMPLE));
    try{
      const recs=await idbAll();
      (recs||[]).forEach(r=>{ blobs[r.id]={name:r.name,blob:r.blob}; objUrl[r.id]=URL.createObjectURL(r.blob); });
    }catch{}
  }
  normalize(true);
  // a magic link lands on the plain URL if the fragment was dropped in transit
  try{
    if(localStorage.getItem('wg.returnAdmin')){
      localStorage.removeItem('wg.returnAdmin');
      if(session && location.hash!=='#admin'){ location.hash='#admin'; mode='admin'; }
    }
  }catch{}
  booted=true;
  rerender();
}
boot();
</script>
